version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: digital_library_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "80:80"
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
      - frontend
    networks:
      - library_network

  # Backend PHP 8.3 (Laravel 11) API
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: digital_library_app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    env_file:
      - ./backend/.env
    environment:
      APP_NAME: "Digital Library"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: digital_library
      DB_USERNAME: library_user
      DB_PASSWORD: library_secret
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    depends_on:
      db:
        condition: service_healthy
    networks:
      - library_network

  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: digital_library_scheduler
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    env_file:
      - ./backend/.env
    environment:
      APP_NAME: "Digital Library"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: digital_library
      DB_USERNAME: library_user
      DB_PASSWORD: library_secret
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    depends_on:
      db:
        condition: service_healthy
    networks:
      - library_network

  queue-worker:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: digital_library_queue_worker
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan queue:work database --sleep=1 --tries=3 --timeout=30
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    env_file:
      - ./backend/.env
    environment:
      APP_NAME: "Digital Library"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: digital_library
      DB_USERNAME: library_user
      DB_PASSWORD: library_secret
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    depends_on:
      db:
        condition: service_healthy
    networks:
      - library_network

  # Database PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: digital_library_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: digital_library
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_user -d digital_library"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - library_network

  # Frontend React (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: digital_library_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:8080/api"
    networks:
      - library_network

  # Mailpit - Test Mail Server
  mailpit:
    image: axllent/mailpit:latest
    container_name: digital_library_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    networks:
      - library_network

volumes:
  pgdata:
    driver: local
  backend_vendor:
    driver: local

networks:
  library_network:
    driver: bridge
